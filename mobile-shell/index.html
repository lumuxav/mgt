<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10243a" />
  <title>MGT Business Suite</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10243a; color: #f8fafc; }
    main { width: min(92vw, 420px); text-align: center; padding: 32px; }
    .mark { width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #1f4f8f; font-weight: 800; font-size: 24px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 18px; opacity: .78; line-height: 1.5; }
    a { display: inline-block; border-radius: 12px; background: #1f4f8f; color: white; padding: 12px 16px; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 1024 1024" role="img" aria-label="MGT">
  <rect width="1024" height="1024" rx="224" fill="#10243a"/>
  <path d="M200 626V390l90 136 90-136v236" fill="none" stroke="#f8fafc" stroke-width="46" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M626 420c-22-24-46-34-73-34-58 0-94 48-94 122s36 122 94 122c28 0 53-9 73-25v-88h-65" fill="none" stroke="#57d9ce" stroke-width="44" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M708 396h136m-68 0v230" fill="none" stroke="#f8fafc" stroke-width="46" stroke-linecap="square"/>
  <path d="M256 756h192l118-56h180m-44-38 44 38-44 38" fill="none" stroke="#f6b94e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
    <h1>MGT Business Suite</h1>
    <p id="status">An internet connection is required to open your business workspace. Check your connection, then open MGT.</p>
    <a id="open" href="https://mgt-lake.vercel.app">Open MGT</a>
    <script>
      const status = document.getElementById('status');
      const open = document.getElementById('open');
      const sync = () => {
        const online = navigator.onLine !== false;
        status.textContent = online
          ? 'Open MGT when your connection is ready. If the workspace does not load, check your network and try again.'
          : 'You are offline. MGT will not post sales, stock, payments or finance changes until a connection is restored.';
        open.style.opacity = online ? '1' : '.45';
        open.style.pointerEvents = online ? 'auto' : 'none';
      };
      window.addEventListener('online', sync);
      window.addEventListener('offline', sync);
      sync();
    </script>
  </main>
</body>
</html>
