name: Finalize Universal MGT Clean History

on:
  push:
    branches:
      - universal-business-platform

permissions:
  contents: write

jobs:
  rewrite-clean-history:
    if: contains(github.event.head_commit.message, '[rewrite-universal-history]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current clean Universal tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create clean Universal root commit
        shell: bash
        run: |
          git config user.name "MGT Repository Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan mgt-clean-root
          git add -A
          git commit -m "Initialize Universal MGT Business Suite"
          CLEAN_SHA="$(git rev-parse HEAD)"
          echo "Clean root: $CLEAN_SHA"
          git push origin HEAD:refs/heads/universal-business-platform --force
          git push origin HEAD:refs/heads/main --force
          git tag -f mgt-test-latest "$CLEAN_SHA"
          git push origin refs/tags/mgt-test-latest --force
