name: Build Android App

on:
  workflow_dispatch:
  pull_request:
    branches: [universal-business-platform]
    paths: ["capacitor.config.json", "mobile-shell/**", "app/mobile-native.css", "app/components/MobileViewport.js", "assets/**", "scripts/configure-android.cjs", "package.json", "package-lock.json", ".github/workflows/build-android-apk.yml"]
  workflow_call:
    inputs:
      release_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build MGT Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MGT_KEYSTORE_BASE64: ${{ secrets.MGT_ANDROID_KEYSTORE_BASE64 }}
      MGT_KEYSTORE_PASSWORD: ${{ secrets.MGT_ANDROID_KEYSTORE_PASSWORD }}
      MGT_KEY_ALIAS: ${{ secrets.MGT_ANDROID_KEY_ALIAS }}
      MGT_KEY_PASSWORD: ${{ secrets.MGT_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci

      - name: Create Android project
        run: npx cap add android

      - name: Set upgrade version and isolate test application
        env:
          MGT_BUILD_NUMBER: ${{ inputs.release_number || github.run_number }}
        run: node scripts/configure-android.cjs

      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgt-android-test-keystore-v1

      - name: Enable camera access for barcode scanning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              manifest_start = text.find("<manifest")
              if manifest_start < 0:
                  raise SystemExit("AndroidManifest.xml has no <manifest> element")
              marker = text.find(">", manifest_start)
              if marker < 0:
                  raise SystemExit("AndroidManifest.xml has an invalid <manifest> element")
              text = text[:marker+1] + "\n    " + permission + text[marker+1:]
              path.write_text(text)
          PY

      - name: Prepare padded round Android launcher icon
        run: |
          python -m pip install 'Pillow==11.3.0'
          python scripts/generate-mgt-round-icons.py --android

      - name: Generate MGT icon and splash assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#10243a' --iconBackgroundColorDark '#10243a' --splashBackgroundColor '#10243a' --splashBackgroundColorDark '#10243a'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build directly installable test APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MGT-Business-Suite-Test.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGT-Business-Suite-Test-APK
          path: MGT-Business-Suite-Test.apk
          if-no-files-found: error
          retention-days: 1

      - name: Detect Android signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "$MGT_KEYSTORE_BASE64" ] && [ -n "$MGT_KEYSTORE_PASSWORD" ] && [ -n "$MGT_KEY_ALIAS" ] && [ -n "$MGT_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release signing
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/universal-business-platform' && github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "$MGT_KEYSTORE_BASE64" | base64 --decode > android/app/mgt-release.jks
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  mgtRelease {
                      storeFile file("mgt-release.jks")
                      storePassword System.getenv("MGT_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MGT_KEY_ALIAS")
                      keyPassword System.getenv("MGT_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.mgtRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/universal-business-platform' && github.event_name != 'pull_request'
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk MGT-Business-Suite-Release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MGT-Business-Suite-Release.aab

      - name: Upload signed release artifacts
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/universal-business-platform' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MGT-Business-Suite-Signed-Release
          path: |
            MGT-Business-Suite-Release.apk
            MGT-Business-Suite-Release.aab
          if-no-files-found: error
          retention-days: 1

