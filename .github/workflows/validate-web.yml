name: Validate Universal MGT Web Build

on:
  workflow_dispatch:
  pull_request:
    branches: [universal-business-platform]
  push:
    branches:
      - universal-business-platform
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'supabase/**'
      - 'docs/**'
      - 'public/**'
      - 'mobile-shell/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
      - 'capacitor.config.json'
      - '.env.example'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Universal MGT project isolation
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SUPABASE_REF="mehuiivevjqmwvaapbgz"

          LEGACY_PATHS=(
            "app/corrections"
            "app/records"
            "app/customer-work"
            "app/transfers"
            "app/stocktake"
            "app/production-report"
            "app/profit"
            "lib/branch.js"
          )

          for path in "${LEGACY_PATHS[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Universal MGT isolation violation: legacy path exists: $path"
              exit 1
            fi
          done

          SCAN_TARGETS=(app lib supabase docs .github README.md .env.example capacitor.config.json mobile-shell)

          mapfile -t SUPABASE_HOSTS < <(
            grep -RhoE               --exclude-dir=.git               --exclude='package-lock.json'               '[a-z0-9]{20}\.supabase\.co'               "${SCAN_TARGETS[@]}" 2>/dev/null | sort -u || true
          )

          if [ "${#SUPABASE_HOSTS[@]}" -eq 0 ]; then
            echo "::error::Universal MGT isolation violation: no Supabase project reference was found."
            exit 1
          fi

          for host in "${SUPABASE_HOSTS[@]}"; do
            if [ "$host" != "${EXPECTED_SUPABASE_REF}.supabase.co" ]; then
              echo "::error::Universal MGT isolation violation: unexpected Supabase project detected: $host"
              exit 1
            fi
          done

          echo "Universal MGT project isolation gate passed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mehuiivevjqmwvaapbgz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-validation-placeholder
        run: npm run build

      - name: Run logic regression tests
        run: npm test

