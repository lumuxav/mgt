name: Validate Universal MGT Web Build

on:
  workflow_dispatch:
  push:
    branches:
      - universal-business-platform
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mehuiivevjqmwvaapbgz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-validation-placeholder
        run: npm run build
